# Refresh the all-time release-downloads badge.
#
# shields.io's own github/downloads/<repo>/total endpoint reliably times out
# for this repo (HTTP 408 — it walks every release's assets inside ~1s), so the
# README badge is a shields /endpoint badge backed by site/downloads.json,
# which this workflow regenerates twice a day. The push below triggers
# pages.yml, which deploys the JSON to the Pages site the badge URL reads.
name: Refresh download badge

on:
  schedule:
    - cron: "13 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Bot pushes never trigger other workflows, so pages.yml would not deploy the
  # refreshed JSON on its own — we dispatch it explicitly after committing.
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recompute all-time downloads into site/downloads.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          total="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            -q '[.[].assets[].download_count] | add // 0' | tail -1)"
          jq -n --arg m "$total" \
            '{schemaVersion:1,label:"downloads",labelColor:"222222",message:$m,color:"58A6FF"}' \
            > site/downloads.json
          cat site/downloads.json
      - name: Commit if the count moved, then redeploy Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git status --porcelain -- site/downloads.json | grep -q .; then
            git add site/downloads.json
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(badges): refresh download count"
            git push
            gh workflow run pages.yml
          else
            echo "count unchanged"
          fi
